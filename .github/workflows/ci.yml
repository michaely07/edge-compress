name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install triton torchao torch-pruning matplotlib pillow imagehash numpy pytest
      - name: Unit tests + Triton kernels in interpreter mode
        env:
          TRITON_INTERPRET: "1"
        run: pytest -q
      - name: End-to-end smoke run (fake data, CPU)
        run: python run_matrix.py --smoke
